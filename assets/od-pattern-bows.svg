<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560"
     style="color: #fffbf8" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    od-pattern-bows.svg
    Original decorative line art — a generic ribbon-bow motif drawn for this
    theme. It is not a copy of the design file's illustration; export that layer
    from Figma when you want the real thing.

    Stroke-only and currentColor, so the section's own text colour drives it and
    one file works on any panel colour. Sized to the panel's 692 x 519 ratio.
  -->
  <defs>
    <g id="od-bow" fill="none" stroke="currentColor" stroke-width="2.2"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- left loop -->
      <path d="M-7 0C-28-27-72-33-84-11c-9 17 13 31 38 22 14-5 27-13 39-11"/>
      <!-- right loop -->
      <path d="M7 0C28-27 72-33 84-11c9 17-13 31-38 22-14-5-27-13-39-11"/>
      <!-- knot -->
      <path d="M-7 0c4 7 10 7 14 0"/>
      <path d="M-5-3c3 5 7 5 10 0"/>
      <!-- tails -->
      <path d="M-5 4C-13 25-26 43-45 55"/>
      <path d="M5 4C13 25 26 43 45 55"/>
      <path d="M-45 55c-6 3-11 4-16 3"/>
      <path d="M45 55c6 3 11 4 16 3"/>
    </g>

  </defs>

  <!--
    Scattered rather than gridded: a regular lattice reads as wallpaper, an
    uneven scatter reads as hand-placed. Opacity varies so the field has depth
    instead of sitting on one flat plane.
  -->
  <g opacity="0.85">
    <use href="#od-bow" transform="translate(108 96) rotate(-14) scale(1.05)"/>
    <use href="#od-bow" transform="translate(402 62) rotate(9) scale(0.78)" opacity="0.7"/>
    <use href="#od-bow" transform="translate(624 154) rotate(-22) scale(0.92)"/>
    <use href="#od-bow" transform="translate(238 268) rotate(26) scale(0.64)" opacity="0.6"/>
    <use href="#od-bow" transform="translate(556 372) rotate(-8) scale(1.12)" opacity="0.8"/>
    <use href="#od-bow" transform="translate(96 418) rotate(17) scale(0.86)"/>
    <use href="#od-bow" transform="translate(352 486) rotate(-30) scale(0.7)" opacity="0.65"/>
    <use href="#od-bow" transform="translate(470 196) rotate(-3) scale(0.58)" opacity="0.5"/>
    <use href="#od-bow" transform="translate(690 300) rotate(34) scale(0.66)" opacity="0.55"/>
    <use href="#od-bow" transform="translate(28 258) rotate(-41) scale(0.72)" opacity="0.6"/>
    <use href="#od-bow" transform="translate(228 118) rotate(48) scale(0.5)" opacity="0.42"/>
  </g>
</svg>
